services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oncoready
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/oncoready
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-3000}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: [./backend:/app, ./seed:/seed, storage:/data/storage]
    ports: ["${BACKEND_HOST_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/oncoready
      REDIS_URL: redis://redis:6379/0
    # PaddleOCR loads models per process; keep concurrency low to bound memory.
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    volumes: [./backend:/app, storage:/data/storage, paddlex-models:/home/app/.paddlex]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_HOST_PORT:-8000}
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next  # container-owned build cache; host `next build` can't clobber it
    ports: ["${FRONTEND_HOST_PORT:-3000}:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  storage:
  paddlex-models:
