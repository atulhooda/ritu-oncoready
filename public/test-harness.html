<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Engageo Voice Test Harness</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
    body { margin: 0; padding: 40px; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #60a5fa; margin-bottom: 8px; }
    .subtitle { color: #94a3b8; margin-bottom: 32px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 16px; border: 1px solid #334155; }
    .status { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
    .status.disconnected { background: #450a0a; color: #fca5a5; }
    .status.connecting { background: #422006; color: #fcd34d; }
    .status.connected { background: #064e3b; color: #6ee7b7; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; }
    .status.disconnected .status-dot { background: #ef4444; }
    .status.connecting .status-dot { background: #eab308; animation: pulse 1s infinite; }
    .status.connected .status-dot { background: #10b981; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; cursor: pointer; margin-right: 8px; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #334155; cursor: not-allowed; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    .meter { height: 24px; background: #0f172a; border-radius: 6px; overflow: hidden; position: relative; border: 1px solid #334155; }
    .meter-fill { height: 100%; background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444); width: 0%; transition: width 100ms ease-out; }
    .meter-label { position: absolute; top: 50%; left: 8px; transform: translateY(-50%); font-size: 12px; font-weight: 600; }
    .row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .row label { min-width: 120px; color: #94a3b8; font-size: 14px; }
    .logs { background: #020617; border-radius: 8px; padding: 16px; font-family: 'SF Mono', Consolas, monospace; font-size: 12px; height: 300px; overflow-y: auto; }
    .log-line { margin-bottom: 4px; }
    .log-line.tx { color: #60a5fa; }
    .log-line.rx { color: #34d399; }
    .log-line.info { color: #94a3b8; }
    .log-line.error { color: #f87171; }
    input[type="text"] { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 8px 12px; border-radius: 6px; flex: 1; font-size: 14px; }
    .phone-input { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Engageo Voice Test Harness</h1>
    <div class="subtitle">Mimics Exotel Voicebot Applet. No telephony provider needed.</div>

    <div class="card">
      <div id="status" class="status disconnected">
        <div class="status-dot"></div>
        <div id="status-text">Disconnected</div>
      </div>

      <div class="phone-input">
        <label>Caller number:</label>
        <input type="text" id="caller-phone" value="+919876543210" placeholder="+91..." />
      </div>

      <button id="connect-btn">Start Call</button>
      <button id="disconnect-btn" class="danger" disabled>End Call</button>
    </div>

    <div class="card">
      <div class="row">
        <label>Your mic level:</label>
        <div class="meter" style="flex: 1;">
          <div class="meter-fill" id="mic-meter"></div>
          <div class="meter-label" id="mic-rms">RMS: 0</div>
        </div>
      </div>
      <div class="row">
        <label>Ritu playback:</label>
        <div class="meter" style="flex: 1;">
          <div class="meter-fill" id="speaker-meter"></div>
          <div class="meter-label" id="speaker-status">Idle</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top: 0; color: #94a3b8; font-size: 14px;">Event Log</h3>
      <div class="logs" id="logs"></div>
    </div>
  </div>

<script>
// ─── Configuration ──────────────────────────────────────────────────────────
const WS_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/media-stream?sample-rate=8000`;
const TARGET_SAMPLE_RATE = 8000;

// ─── State ──────────────────────────────────────────────────────────────────
let ws = null;
let audioContext = null;
let micStream = null;
let micNode = null;
let streamSid = null;

// Scheduled-playback bookkeeping. nextScheduledEndTime is the audioContext
// timestamp at which the last scheduled chunk will finish — used to time
// the mark echo so it fires when audio *actually* finishes playing
// (matching real Exotel behavior, not the previous hardcoded 100ms guess).
let nextScheduledEndTime = 0;
let activeSources = [];

// ─── UI Elements ────────────────────────────────────────────────────────────
const statusEl = document.getElementById('status');
const statusText = document.getElementById('status-text');
const connectBtn = document.getElementById('connect-btn');
const disconnectBtn = document.getElementById('disconnect-btn');
const callerPhoneInput = document.getElementById('caller-phone');
const logsEl = document.getElementById('logs');
const micMeter = document.getElementById('mic-meter');
const micRmsEl = document.getElementById('mic-rms');
const speakerMeter = document.getElementById('speaker-meter');
const speakerStatus = document.getElementById('speaker-status');

// ─── Logging ────────────────────────────────────────────────────────────────
function log(msg, type = 'info') {
  const line = document.createElement('div');
  line.className = `log-line ${type}`;
  const time = new Date().toLocaleTimeString('en-US', { hour12: false });
  line.textContent = `[${time}] ${msg}`;
  logsEl.appendChild(line);
  logsEl.scrollTop = logsEl.scrollHeight;
  if (logsEl.children.length > 200) logsEl.removeChild(logsEl.firstChild);
}

function setStatus(state, text) {
  statusEl.className = `status ${state}`;
  statusText.textContent = text;
}

// ─── Audio Helpers ──────────────────────────────────────────────────────────

function float32ToPcm16(float32Array) {
  const pcm16 = new Int16Array(float32Array.length);
  for (let i = 0; i < float32Array.length; i++) {
    const s = Math.max(-1, Math.min(1, float32Array[i]));
    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return pcm16;
}

function pcm16ToFloat32(pcm16Array) {
  const float32 = new Float32Array(pcm16Array.length);
  for (let i = 0; i < pcm16Array.length; i++) {
    float32[i] = pcm16Array[i] / 0x8000;
  }
  return float32;
}

function downsample(float32Array, fromRate, toRate) {
  if (fromRate === toRate) return float32Array;
  const ratio = fromRate / toRate;
  const newLength = Math.round(float32Array.length / ratio);
  const result = new Float32Array(newLength);
  let offsetResult = 0;
  let offsetBuffer = 0;
  while (offsetResult < result.length) {
    const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
    let accum = 0, count = 0;
    for (let i = offsetBuffer; i < nextOffsetBuffer && i < float32Array.length; i++) {
      accum += float32Array[i];
      count++;
    }
    result[offsetResult] = count > 0 ? accum / count : 0;
    offsetResult++;
    offsetBuffer = nextOffsetBuffer;
  }
  return result;
}

function pcm16ToBase64(pcm16) {
  const bytes = new Uint8Array(pcm16.buffer);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function base64ToPcm16(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Int16Array(bytes.buffer);
}

function computeRMS(pcm16) {
  let sum = 0;
  for (let i = 0; i < pcm16.length; i++) sum += pcm16[i] * pcm16[i];
  return Math.sqrt(sum / pcm16.length);
}

// ─── Playback (PCM16 from server → speakers, schedule-based) ───────────────
// Each incoming chunk is scheduled to start exactly when the previous chunk
// ends, using audioContext.currentTime. This gives us an accurate notion of
// when audio finishes playing — required for realistic mark echo timing.

function enqueuePlayback(pcm16) {
  if (!audioContext) return;

  const float32 = pcm16ToFloat32(pcm16);
  const buffer = audioContext.createBuffer(1, float32.length, TARGET_SAMPLE_RATE);
  buffer.copyToChannel(float32, 0);

  const source = audioContext.createBufferSource();
  source.buffer = buffer;
  source.connect(audioContext.destination);

  const now = audioContext.currentTime;
  const startTime = Math.max(now, nextScheduledEndTime);
  source.start(startTime);
  nextScheduledEndTime = startTime + buffer.duration;

  activeSources.push(source);
  source.onended = () => {
    activeSources = activeSources.filter(s => s !== source);
    if (activeSources.length === 0) {
      speakerMeter.style.width = '0%';
      speakerStatus.textContent = 'Idle';
    }
  };

  const rms = computeRMS(pcm16);
  speakerMeter.style.width = `${Math.min(100, rms / 100)}%`;
  speakerStatus.textContent = `RMS: ${Math.round(rms)}`;
}

function clearPlayback() {
  for (const source of activeSources) {
    try { source.stop(); } catch (e) {}
  }
  activeSources = [];
  nextScheduledEndTime = audioContext ? audioContext.currentTime : 0;
  speakerMeter.style.width = '0%';
  speakerStatus.textContent = 'Cleared';
}

// ─── Mic Capture ────────────────────────────────────────────────────────────

async function startMicCapture() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      channelCount: 1,
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    }
  });

  audioContext = new AudioContext({ sampleRate: 48000 });
  nextScheduledEndTime = audioContext.currentTime;

  const source = audioContext.createMediaStreamSource(micStream);
  const processor = audioContext.createScriptProcessor(4096, 1, 1);
  source.connect(processor);
  processor.connect(audioContext.destination);

  const nativeSampleRate = audioContext.sampleRate;
  log(`Audio context: ${nativeSampleRate} Hz native, downsampling to ${TARGET_SAMPLE_RATE} Hz`, 'info');

  processor.onaudioprocess = (event) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    const input = event.inputBuffer.getChannelData(0);
    const downsampled = downsample(input, nativeSampleRate, TARGET_SAMPLE_RATE);
    const pcm16 = float32ToPcm16(downsampled);

    const rms = computeRMS(pcm16);
    micMeter.style.width = `${Math.min(100, rms / 100)}%`;
    micRmsEl.textContent = `RMS: ${Math.round(rms)}`;

    ws.send(JSON.stringify({
      event: 'media',
      media: { payload: pcm16ToBase64(pcm16) }
    }));
  };

  micNode = processor;
}

function stopMicCapture() {
  if (micStream) {
    micStream.getTracks().forEach(track => track.stop());
    micStream = null;
  }
  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }
  micMeter.style.width = '0%';
  micRmsEl.textContent = 'RMS: 0';
}

// ─── WebSocket Connection ───────────────────────────────────────────────────

async function startCall() {
  const callerPhone = callerPhoneInput.value.trim() || '+919876543210';
  connectBtn.disabled = true;
  setStatus('connecting', 'Connecting...');
  log('Opening WebSocket to ' + WS_URL, 'info');

  streamSid = 'test_' + Math.random().toString(36).substring(2, 11);
  const callSid = 'call_' + Math.random().toString(36).substring(2, 11);

  try {
    await startMicCapture();
  } catch (e) {
    log('Mic access denied: ' + e.message, 'error');
    setStatus('disconnected', 'Mic access denied');
    connectBtn.disabled = false;
    return;
  }

  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    setStatus('connected', `Connected — streamSid: ${streamSid}`);
    log('WebSocket open', 'rx');
    disconnectBtn.disabled = false;

    ws.send(JSON.stringify({ event: 'connected' }));
    ws.send(JSON.stringify({
      event: 'start',
      start: {
        streamSid,
        callSid,
        from: callerPhone,
        customParameters: {
          From: callerPhone,
          callerPhone: callerPhone,
          callSource: 'test_harness'
        }
      }
    }));
    log(`Sent start event — callSid=${callSid}, from=${callerPhone}`, 'tx');
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      handleServerMessage(msg);
    } catch (e) {
      log('Failed to parse server message: ' + e.message, 'error');
    }
  };

  ws.onerror = () => log('WebSocket error', 'error');

  ws.onclose = () => {
    log('WebSocket closed by server', 'info');
    cleanup();
  };
}

function handleServerMessage(msg) {
  switch (msg.event) {
    case 'media':
      if (msg.media && msg.media.payload) {
        const pcm16 = base64ToPcm16(msg.media.payload);
        enqueuePlayback(pcm16);
      }
      break;
    case 'mark': {
      log(`Mark received: ${msg.mark?.name}`, 'rx');
      // Echo back when scheduled audio actually finishes — real Exotel
      // emits the mark confirmation only after physical playback ends.
      const remainingMs = audioContext
        ? Math.max(0, (nextScheduledEndTime - audioContext.currentTime) * 1000)
        : 0;
      const delay = Math.max(50, remainingMs);
      setTimeout(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            event: 'mark',
            streamSid,
            mark: msg.mark
          }));
          log(`Mark echoed after ${Math.round(delay)}ms: ${msg.mark?.name}`, 'tx');
        }
      }, delay);
      break;
    }
    case 'clear':
      log('Clear received — dropping playback queue', 'rx');
      clearPlayback();
      break;
    case 'stop':
      log('Stop received', 'rx');
      endCall();
      break;
    default:
      log(`Unknown event: ${msg.event}`, 'info');
  }
}

function endCall() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ event: 'stop' }));
    ws.close();
  }
  cleanup();
}

function cleanup() {
  stopMicCapture();
  clearPlayback();
  ws = null;
  streamSid = null;
  setStatus('disconnected', 'Disconnected');
  connectBtn.disabled = false;
  disconnectBtn.disabled = true;
}

connectBtn.addEventListener('click', startCall);
disconnectBtn.addEventListener('click', endCall);

log('Test harness ready. Click "Start Call" to begin.', 'info');
log('Server URL: ' + WS_URL, 'info');
</script>
</body>
</html>
