# ═══════════════════════════════════════════════════════════════════════════
# THE GATE, OFF THIS LAPTOP.
#
# The pre-push hook is the primary gate and catches things before they leave the
# machine. This is the backstop for everything the hook cannot cover: a push
# from another clone, a hook nobody installed, a SUITE_BYPASS=1 deploy, or a
# commit made through the GitHub web UI.
#
# It deliberately runs tools/gate.sh — the SAME file the hook runs — rather than
# listing the steps again here. A CI job carrying its own copy of the gate drifts
# from the hook and then reports green on checks the hook would have failed,
# which is worse than having no CI. This repo has paid for that class of bug six
# times; the gate is the last place to repeat it.
# ═══════════════════════════════════════════════════════════════════════════
name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The suite runs against pg-mem by default; this service restores the cases
    # that need a real Postgres — every booking case, the partial unique index
    # behind taken-slot reporting, and uuid = ANY(). Without it those tests skip
    # and CI would be quietly weaker than a local run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ritu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # ritu-evals is a separate private repo. When a token is available we
      # check it out and the gate runs complete; when it is not, gate.sh --ci
      # says plainly which three checks did not run rather than passing silently.
      - name: Check out ritu-evals (optional)
        id: evals
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: siddharthpathania/ritu-evals
          path: ritu-evals
          token: ${{ secrets.RITU_EVALS_TOKEN }}

      - name: Run the gate
        env:
          # Only point at the eval repo if the checkout actually succeeded.
          RITU_EVALS_DIR: ${{ steps.evals.outcome == 'success' && format('{0}/ritu-evals', github.workspace) || '' }}
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/ritu_test
          SKIP_BOOT_AUDIO: '1'
        run: sh tools/gate.sh --ci

      - name: Upload gate logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: /tmp/gate-*.log
          if-no-files-found: ignore
